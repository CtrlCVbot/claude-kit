version: "1.0"
scope: claude-kit-operating-system-v1

scopeRules:
  docsInclude:
    - docs/guide/*.md
    - docs/team-orchestration/*.md
    - docs/operating-system/*.md
  docsExclude:
    - docs/**/revision/**
    - docs/**/archive/**
  inventoryRule: 수기 합계는 문서에 쓰지 않고 asset-registry에서 artifactType별로 계산한다.

freshnessRules:
  rule-agent-contract: agent prompt contract, 역할 책임, 호출 stage가 바뀌면 갱신한다.
  rule-command-contract: command entrypoint, stage routing, 연결 agent가 바뀌면 갱신한다.
  rule-skill-contract: workflow checklist, invoked command set, guardrail이 바뀌면 갱신한다.
  rule-hook-policy: event, matcher, blocking policy가 바뀌면 갱신한다.
  rule-doc-boundary: 참조 registry ID, SSOT 경계, 단계 명칭이 바뀌면 갱신한다.

