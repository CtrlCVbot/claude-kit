version: "1.0"
scope: claude-kit-operating-system-v1

teams:
  - teamId: team-executive-office
    teamName: Executive Office
    mission: 사람 승인, 우선순위, 예외 처리를 통해 Company OS의 방향과 경계를 관리한다.
    roleIds:
      - role-portfolio-director
    ownedPipelines:
      - pipe-operating-review
    kpiIds:
      - metric-blocked-feature-count
      - metric-approval-wait-hours
      - metric-registry-coverage-ratio

  - teamId: team-planning-studio
    teamName: Planning Studio
    mission: 아이디어를 실행 가능한 PRD와 handoff 산출물로 정규화한다.
    roleIds:
      - role-planning-ops-lead
      - role-design-prd-lead
    ownedPipelines:
      - pipe-planning-lifecycle
    kpiIds:
      - metric-handoff-latency-hours
      - metric-plan-review-pass-rate
      - metric-doc-freshness-ratio

  - teamId: team-delivery-studio
    teamName: Delivery Studio
    mission: 승인된 PRD를 feature package, 구현, 검증 가능한 개발 흐름으로 전개한다.
    roleIds:
      - role-delivery-engineering-lead
      - role-delivery-architecture-lead
    ownedPipelines:
      - pipe-delivery-lifecycle
    kpiIds:
      - metric-active-feature-runs
      - metric-dev-verify-pass-rate
      - metric-handoff-latency-hours

  - teamId: team-assurance-desk
    teamName: Assurance Desk
    mission: 리뷰, 검증, 보안, 문서 신선도를 유지하며 운영 read model을 안정화한다.
    roleIds:
      - role-quality-governance-lead
    ownedPipelines:
      - pipe-orchestration-control
    kpiIds:
      - metric-dev-verify-pass-rate
      - metric-orphan-asset-count
      - metric-doc-freshness-ratio

roles:
  - roleId: role-portfolio-director
    teamId: team-executive-office
    responsibilities:
      - P2와 Phase B의 사람 승인 기준을 유지한다.
      - blocker, 우선순위, pilot 범위 같은 회사 단위 결정을 내린다.
      - 운영 레이어와 기존 SSOT 간 경계 변경을 승인한다.
    ownedAgentIds: []
    decisionRights:
      - priority-order
      - gate-p2-approval
      - gate-phase-b-human-review
      - pilot-scope
      - exception-policy
    handoffTargets:
      - role-planning-ops-lead
      - role-quality-governance-lead

  - roleId: role-planning-ops-lead
    teamId: team-planning-studio
    responsibilities:
      - idea intake, screening, archive/improve loop를 운영한다.
      - plan pipeline의 진입점과 상태 전환 규칙을 정합하게 유지한다.
      - planning 산출물을 bridge 가능한 구조로 정리한다.
    ownedAgentIds:
      - agent-plan-idea-collector
      - agent-plan-idea-screener
    decisionRights:
      - idea-normalization
      - screening-threshold
      - archive-routing
      - bridge-readiness
    handoffTargets:
      - role-design-prd-lead
      - role-quality-governance-lead
      - role-portfolio-director

  - roleId: role-design-prd-lead
    teamId: team-planning-studio
    responsibilities:
      - first-pass를 PRD, wireframe, stitch 수준의 설계 산출물로 확장한다.
      - 화면, 상호작용, handoff completeness를 책임진다.
      - planning 품질 이슈를 quality lead와 함께 닫는다.
    ownedAgentIds:
      - agent-plan-prd-writer
      - agent-plan-wireframe-designer
      - agent-plan-stitch-integrator
    decisionRights:
      - prd-structure
      - design-fidelity
      - stitch-readiness
    handoffTargets:
      - role-planning-ops-lead
      - role-delivery-engineering-lead
      - role-quality-governance-lead

  - roleId: role-delivery-engineering-lead
    teamId: team-delivery-studio
    responsibilities:
      - feature package 생성, 구현 루프, commit-ready 상태를 관리한다.
      - dev workflow와 테스트 루프를 운영한다.
      - 구현 중 발견된 scope gap을 상위 planning 역할에 되돌린다.
    ownedAgentIds: []
    decisionRights:
      - implementation-scope
      - tdd-loop
      - commit-readiness
      - refactor-window
    handoffTargets:
      - role-delivery-architecture-lead
      - role-quality-governance-lead
      - role-portfolio-director

  - roleId: role-delivery-architecture-lead
    teamId: team-delivery-studio
    responsibilities:
      - 아키텍처, domain boundary, DB 관련 기술 결정을 검토한다.
      - 장기 유지보수성과 설계 부채 관리를 담당한다.
      - delivery pipeline의 구조 변경 요청을 평가한다.
    ownedAgentIds:
      - agent-dev-architect
      - agent-dev-database-reviewer
    decisionRights:
      - architecture-boundary
      - database-safety
      - shared-module-policy
    handoffTargets:
      - role-delivery-engineering-lead
      - role-quality-governance-lead

  - roleId: role-quality-governance-lead
    teamId: team-assurance-desk
    responsibilities:
      - plan/dev review, verification, 보안, 문서 freshness를 통합 관리한다.
      - stage-manifest 기반 read model과 dashboard 신뢰도를 유지한다.
      - asset registry 누락과 stale doc을 운영 이슈로 승격한다.
    ownedAgentIds:
      - agent-plan-reviewer
      - agent-dev-code-reviewer
      - agent-dev-security-reviewer
      - agent-dev-verify-agent
      - agent-dev-doc-updater
    decisionRights:
      - review-severity
      - verification-policy
      - security-escalation
      - doc-freshness-exception
      - asset-registry-coverage
    handoffTargets:
      - role-portfolio-director
      - role-planning-ops-lead
      - role-delivery-engineering-lead
